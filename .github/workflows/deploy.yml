name: Deploy

# CI is the gate: this runs after the CI workflow succeeds on a push to `main`,
# not on the push itself. `main` is protected and requires CI, so the gap being
# closed is narrow — two individually-green pull requests that break each other
# once both are on `main`. That is precisely the commit that must not ship.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

# Read-only by default. The publish job widens this for itself, and only itself.
permissions:
  contents: read

# Production deploys are serialised against each other, and nothing else. It is
# tempting to put every `gh-pages` writer in one group, but GitHub keeps only one
# *pending* run per group and cancels the rest: two pull requests queued behind a
# deploy would lose a preview outright. Cross-writer safety is publish.sh's push
# retry instead, which rebuilds on the new tip and pushes again. Never cancel a
# deploy in flight — a superseded one is about to be replaced anyway, but a
# half-applied one is a broken site.
concurrency:
  group: gh-pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Build
    # `workflow_run` fires for every CI completion — pull requests and failures
    # included — so the trigger has to be narrowed here rather than in `on`.
    # A manual dispatch carries no `workflow_run` payload and passes on the first
    # clause instead.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The site's entry script, so the publish job can prove the deployment it is
    # smoke-testing is this build rather than the one it replaced.
    outputs:
      entry: ${{ steps.entry.outputs.path }}

    steps:
      # Actions are pinned to full commit SHAs rather than tags. A tag can be
      # moved to point at different code; a SHA cannot.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A `workflow_run` job checks out the default branch's tip by default.
          # Pin it to the commit CI actually validated, or a merge landing while
          # this run is queued would deploy code that was never tested as a unit.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up pnpm
        # Version comes from `packageManager` in package.json — one source of truth.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Read from the manifest, then drop it: it is a build-time index, not part
      # of the site, and there is no reason to serve it.
      - name: Resolve entry script
        id: entry
        run: |
          path=$(jq -r 'to_entries[] | select(.value.isEntry) | .value.file' \
            apps/web/dist/.vite/manifest.json | head -n 1)
          [ -n "$path" ] || { echo 'no entry chunk in the build manifest' >&2; exit 1; }
          echo "path=$path" >> "$GITHUB_OUTPUT"
          rm -rf apps/web/dist/.vite

      - name: Upload site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: apps/web/dist
          retention-days: 1

  publish:
    name: Publish and smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The one job that writes. Splitting it from `build` is the point: the build
    # runs the repository's own code and every dependency in its lockfile, and it
    # does that without a token that can push anywhere.
    permissions:
      contents: write

    env:
      SITE_URL: https://astro-game-lab.github.io/hohmann-heist/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site

      # `${{ }}` values are passed through the environment rather than pasted into
      # the script, so nothing carried by the event can be read as shell.
      - name: Publish to gh-pages
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tools/pages/publish.sh publish site . "deploy: ${SHA}"

      # A deploy that reports success and serves a blank page is the failure mode
      # worth automating against, so the run is not green until the live URL is.
      # The retry window is wide because a Pages branch build is slower to go live
      # than the artifact deployment this replaced, and pinning the entry script
      # means the wait ends when the new build is serving rather than when the old
      # one answers.
      - name: Smoke test
        env:
          ENTRY: ${{ needs.build.outputs.entry }}
          SMOKE_RETRIES: '30'
          SMOKE_RETRY_DELAY: '10'
        run: tools/smoke/smoke.sh "$SITE_URL" "$ENTRY"
